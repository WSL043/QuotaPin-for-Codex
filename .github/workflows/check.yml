name: check

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quotapin-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos-native-lifecycle:
    name: macOS native lifecycle (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - name: Verify portable core and macOS adapter
        timeout-minutes: 8
        run: |
          npm ci
          tests=()
          for file in test/*.test.mjs; do
            case "$(basename "$file")" in
              auto-attach-policy.test.mjs|bootstrap-contract.test.mjs|bootstrap-download.test.mjs|install-lifecycle-transaction.test.mjs|lifecycle-rollback.test.mjs|release-gates.test.mjs|release-trust.test.mjs|update-transaction.test.mjs|windows-powershell-contract.test.mjs) ;;
              *) tests+=("$file") ;;
            esac
          done
          # Intel runners can starve the shared Chromium fixture when Node runs
          # every test file in parallel.  Serialize files so a real 15-second
          # CDP timeout remains meaningful instead of cascading from host load.
          node --test --test-concurrency=1 "${tests[@]}"
      - name: Check macOS lifecycle scripts
        run: |
          bash -n install-macos.sh
          for file in scripts/macos/*.sh; do bash -n "$file"; done
      - name: Build and self-check native macOS binaries
        run: |
          test "$(uname -m)" = "${{ matrix.arch }}"
          ./scripts/macos/build.sh
      - name: Exercise install, update, staged LaunchAgent, and uninstall
        run: ./scripts/macos/test-lifecycle.sh dist/macos-native
      - name: Upload native macOS slice
        id: upload-native
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QuotaPin-macOS-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: dist/macos-native/
      - name: Record native lifecycle evidence
        run: |
          {
            echo "### macOS native lifecycle"
            echo "- Runner: \`${{ matrix.runner }}\`"
            echo "- Architecture: \`${{ matrix.arch }}\`"
            echo "- Artifact digest: \`${{ steps.upload-native.outputs.artifact-digest }}\`"
            echo "- Result: build, self-check, install, staged LaunchAgent, transactional repair, config preservation, uninstall"
          } >> "$GITHUB_STEP_SUMMARY"

  macos-universal-package:
    name: macOS universal package
    needs: macos-native-lifecycle
    runs-on: macos-15
    timeout-minutes: 15
    outputs:
      package-sha256: ${{ steps.package.outputs.package-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - name: Download both native slices
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: QuotaPin-macOS-*-${{ github.sha }}
          path: dist/thin
      - name: Assemble and verify one universal package
        id: package
        run: |
          npm ci
          ARM="dist/thin/QuotaPin-macOS-arm64-${{ github.sha }}"
          X64="dist/thin/QuotaPin-macOS-x86_64-${{ github.sha }}"
          ./scripts/macos/package-universal.sh "$ARM" "$X64" dist/macos-universal
          VERSION="$(tr -d '\r\n' < VERSION)"
          PACKAGE="dist/QuotaPin-macOS-$VERSION.dmg"
          test -s "$PACKAGE"
          lipo -archs dist/macos-universal/QuotaPin.Mac | grep -q arm64
          lipo -archs dist/macos-universal/QuotaPin.Mac | grep -q x86_64
          echo "package-sha256=$(shasum -a 256 "$PACKAGE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - name: Upload commit-scoped universal macOS package
        id: upload-universal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QuotaPin-macOS-universal-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: dist/QuotaPin-macOS-*.dmg
      - name: Record universal package evidence
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          PACKAGE="dist/QuotaPin-macOS-$VERSION.dmg"
          {
            echo "### macOS universal package"
            echo "- Package: \`$(basename "$PACKAGE")\`"
            echo "- Package SHA-256: \`$(shasum -a 256 "$PACKAGE" | awk '{print $1}')\`"
            echo "- Artifact digest: \`${{ steps.upload-universal.outputs.artifact-digest }}\`"
            echo "- Slices: \`arm64 x86_64\`"
          } >> "$GITHUB_STEP_SUMMARY"

  macos-universal-lifecycle:
    name: macOS final package lifecycle (${{ matrix.runner }} / ${{ matrix.arch }})
    needs: macos-universal-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download digest-verified universal package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: QuotaPin-macOS-universal-${{ github.sha }}
          path: dist/final
      - name: Exercise the exact final package on native hardware
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          PACKAGE="dist/final/QuotaPin-macOS-$VERSION.dmg"
          test "$(shasum -a 256 "$PACKAGE" | awk '{print $1}')" = "${{ needs.macos-universal-package.outputs.package-sha256 }}"
          ./scripts/macos/test-universal-package.sh "$PACKAGE" "${{ matrix.arch }}"
      - name: Record final-package evidence
        run: |
          {
            echo "### macOS final package acceptance"
            echo "- Native architecture: \`${{ matrix.arch }}\`"
            echo "- Artifact handoff: GitHub digest validated on download"
            echo "- Result: safe extraction, universal slices, code integrity, install, staged LaunchAgent, rollback, update, uninstall"
          } >> "$GITHUB_STEP_SUMMARY"

  validate:
    needs: macos-universal-lifecycle
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - name: Check JavaScript syntax
        timeout-minutes: 8
        run: |
          npm ci
          npm run check
      - name: Check Windows PowerShell syntax
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Install the pinned Inno Setup compiler
        shell: powershell
        run: .\scripts\install-inno-ci.ps1
      - name: Download the verified universal macOS package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: QuotaPin-macOS-universal-${{ github.sha }}
          path: dist
      - name: Build and self-check the complete Windows package
        shell: powershell
        run: .\scripts\build-windows.ps1 -ReleaseManifest
      - name: Verify the cross-platform public candidate
        shell: powershell
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          $commit = (& git rev-parse HEAD).Trim()
          $candidateTag = "v$version"
          & git tag $candidateTag $commit
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the local candidate tag.' }
          try {
            node scripts/public-release.mjs prepare-ci --root . --source dist --output dist/public --repository https://github.com/WSL043/QuotaPin-for-Codex --commit $commit --tag $candidateTag --workflow-run-id $env:GITHUB_RUN_ID
            if ($LASTEXITCODE -ne 0) { throw 'CI candidate preparation failed.' }
            node scripts/public-release.mjs verify-ci --root . --directory dist/public --repository https://github.com/WSL043/QuotaPin-for-Codex --commit $commit --tag $candidateTag --workflow-run-id $env:GITHUB_RUN_ID
            if ($LASTEXITCODE -ne 0) { throw 'CI candidate verification failed.' }
          }
          finally {
            & git tag --delete $candidateTag | Out-Null
          }

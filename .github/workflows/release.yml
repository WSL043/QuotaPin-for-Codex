name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: quotapin-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22.23.1
  OFFICIAL_REPOSITORY: https://github.com/WSL043/QuotaPin-for-Codex

jobs:
  macos-native-release:
    name: Build and test macOS release slice (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Verify tagged source and native architecture
        run: |
          test "$GITHUB_REF_TYPE" = tag
          VERSION="$(tr -d '\r\n' < VERSION)"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(uname -m)" = "${{ matrix.arch }}"
          test -f ".github/release-notes/$GITHUB_REF_NAME.md"

      - name: Install locked build dependencies
        run: npm ci --ignore-scripts

      - name: Run portable and macOS product gates
        run: |
          tests=()
          for file in test/*.test.mjs; do
            case "$(basename "$file")" in
              auto-attach-policy.test.mjs|bootstrap-contract.test.mjs|bootstrap-download.test.mjs|install-lifecycle-transaction.test.mjs|lifecycle-rollback.test.mjs|release-gates.test.mjs|release-trust.test.mjs|update-transaction.test.mjs|windows-powershell-contract.test.mjs) ;;
              *) tests+=("$file") ;;
            esac
          done
          # Keep the release gate deterministic on the lower-throughput Intel
          # runner without weakening any fixture command timeout or assertion.
          node --test --test-concurrency=1 "${tests[@]}"
          bash -n install-macos.sh
          for file in scripts/macos/*.sh; do bash -n "$file"; done

      - name: Build, self-check, and exercise the native lifecycle
        run: |
          ./scripts/macos/build.sh
          ./scripts/macos/test-lifecycle.sh dist/macos-native

      - name: Upload native release slice
        id: upload-native
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QuotaPin-macOS-release-${{ matrix.arch }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 2
          path: dist/macos-native/
      - name: Record native release evidence
        run: |
          {
            echo "### macOS release slice"
            echo "- Runner: \`${{ matrix.runner }}\`"
            echo "- Architecture: \`${{ matrix.arch }}\`"
            echo "- Artifact digest: \`${{ steps.upload-native.outputs.artifact-digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  macos-universal-release:
    name: Assemble universal macOS release package
    needs: macos-native-release
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      package-sha256: ${{ steps.package.outputs.package-sha256 }}
    steps:
      - name: Check out the same tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Download both independently tested slices
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: QuotaPin-macOS-release-*-${{ github.sha }}
          path: dist/thin

      - name: Build and verify one universal package
        id: package
        run: |
          npm ci --ignore-scripts
          ARM="dist/thin/QuotaPin-macOS-release-arm64-${{ github.sha }}"
          X64="dist/thin/QuotaPin-macOS-release-x86_64-${{ github.sha }}"
          ./scripts/macos/package-universal.sh "$ARM" "$X64" dist/macos-universal
          VERSION="$(tr -d '\r\n' < VERSION)"
          PACKAGE="dist/QuotaPin-macOS-$VERSION.dmg"
          test -s "$PACKAGE"
          for binary in QuotaPin.Mac; do
            ARCHS="$(lipo -archs "dist/macos-universal/$binary")"
            [[ "$ARCHS" == *arm64* && "$ARCHS" == *x86_64* ]]
          done
          echo "package-sha256=$(shasum -a 256 "$PACKAGE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Upload universal macOS release package
        id: upload-universal
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QuotaPin-macOS-universal-${{ github.sha }}
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
          path: dist/QuotaPin-macOS-*.dmg
      - name: Record universal release evidence
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          PACKAGE="dist/QuotaPin-macOS-$VERSION.dmg"
          {
            echo "### macOS universal release candidate"
            echo "- Package SHA-256: \`$(shasum -a 256 "$PACKAGE" | awk '{print $1}')\`"
            echo "- Artifact digest: \`${{ steps.upload-universal.outputs.artifact-digest }}\`"
            echo "- Slices: \`arm64 x86_64\`"
          } >> "$GITHUB_STEP_SUMMARY"

  macos-final-release-lifecycle:
    name: Test final macOS release package (${{ matrix.runner }} / ${{ matrix.arch }})
    needs: macos-universal-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the same tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download digest-verified universal release package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: QuotaPin-macOS-universal-${{ github.sha }}
          path: dist/final
      - name: Exercise the exact release package on native hardware
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          PACKAGE="dist/final/QuotaPin-macOS-$VERSION.dmg"
          test "$(shasum -a 256 "$PACKAGE" | awk '{print $1}')" = "${{ needs.macos-universal-release.outputs.package-sha256 }}"
          ./scripts/macos/test-universal-package.sh "$PACKAGE" "${{ matrix.arch }}"
      - name: Record final release acceptance
        run: |
          {
            echo "### macOS release package acceptance"
            echo "- Native architecture: \`${{ matrix.arch }}\`"
            echo "- Result: safe extraction, universal slices, code integrity, install, LaunchAgent, rollback, update, uninstall"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build cross-platform release candidate
    needs: macos-final-release-lifecycle
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Verify immutable source identity
        shell: powershell
        run: |
          if ($env:GITHUB_REF_TYPE -ne 'tag') { throw 'Release builds require a tag ref.' }
          $version = (Get-Content -Raw VERSION).Trim()
          $packageVersion = (& node -p "require('./package.json').version").Trim()
          $packageLockVersion = (& node -p "require('./package-lock.json').version").Trim()
          if ($LASTEXITCODE -ne 0 -or $packageVersion -ne $version -or $packageLockVersion -ne $version) {
            throw 'VERSION, package.json, and package-lock.json do not agree.'
          }
          if ($env:GITHUB_REF_NAME -cne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME does not match VERSION $version."
          }
          $isStable = $version -cmatch '^\d+\.\d+\.\d+$'
          $isBeta = $version -cmatch '^\d+\.\d+\.\d+-beta\.\d+$'
          if (-not $isStable -and -not $isBeta) { throw 'GitHub Releases accept reviewed stable or beta versions only. Development candidates stay in Actions.' }
          $head = (& git rev-parse HEAD).Trim()
          $tagCommit = (& git rev-parse "$env:GITHUB_REF_NAME`^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:GITHUB_SHA -or $tagCommit -cne $env:GITHUB_SHA) {
            throw 'Tag, workflow commit, and checked-out HEAD do not agree.'
          }
          & git fetch --no-tags --depth=1 origin '+refs/heads/main:refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the protected main branch.' }
          & git merge-base --is-ancestor $env:GITHUB_SHA 'refs/remotes/origin/main'
          if ($LASTEXITCODE -ne 0) { throw 'The release tag commit is not reachable from origin/main.' }
          $dirty = @(& git status --porcelain=v1 --untracked-files=all)
          if ($dirty.Count) { throw "Release checkout is dirty: $($dirty -join ', ')" }
          $notes = Join-Path '.github\release-notes' "$env:GITHUB_REF_NAME.md"
          if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
            throw "A reviewed release note is required: $notes"
          }

      - name: Install locked build dependencies
        run: npm ci --ignore-scripts

      - name: Install the pinned Inno Setup compiler
        shell: powershell
        run: .\scripts\install-inno-ci.ps1

      - name: Run source and product gates
        shell: powershell
        run: |
          npm run check
          $version = (Get-Content -Raw VERSION).Trim()
          $channelGate = if ($version -cmatch '^\d+\.\d+\.\d+$') { '--require-stable' } else { '--require-beta' }
          node scripts/check-public-baseline.mjs $channelGate
          if ($LASTEXITCODE -ne 0) { throw 'Public source channel gate failed.' }

      - name: Parse tracked Windows PowerShell
        shell: powershell
        run: |
          $failed = $false
          foreach ($relativePath in @(& git ls-files '*.ps1')) {
            $tokens = $null
            $errors = $null
            $path = Join-Path $PWD $relativePath
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File): $($_.Message)" }
            }
          }
          if ($failed) { throw 'PowerShell syntax check failed.' }

      - name: Download the verified universal macOS package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: QuotaPin-macOS-universal-${{ github.sha }}
          path: dist

      - name: Build self-contained Windows package
        shell: powershell
        run: .\scripts\build-windows.ps1 -ReleaseManifest

      - name: Prepare exact public asset set
        shell: powershell
        run: |
          node scripts/public-release.mjs prepare `
            --root . `
            --source dist `
            --output dist/public `
            --repository $env:OFFICIAL_REPOSITORY `
            --commit $env:GITHUB_SHA `
            --tag $env:GITHUB_REF_NAME `
            --workflow-run-id $env:GITHUB_RUN_ID
          if ($LASTEXITCODE -ne 0) { throw 'Public release preparation failed.' }
          node scripts/public-release.mjs verify `
            --root . `
            --directory dist/public `
            --repository $env:OFFICIAL_REPOSITORY `
            --commit $env:GITHUB_SHA `
            --tag $env:GITHUB_REF_NAME `
            --workflow-run-id $env:GITHUB_RUN_ID
          if ($LASTEXITCODE -ne 0) { throw 'Public release verification failed.' }

      - name: Confirm build did not mutate source
        shell: powershell
        run: |
          $dirty = @(& git status --porcelain=v1 --untracked-files=all)
          if ($dirty.Count) { throw "Release build mutated source: $($dirty -join ', ')" }

      - name: Upload immutable cross-platform candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: QuotaPin-Package-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: dist/public/

  windows-arm64-emulation:
    name: Accept Windows package on Windows 11 Arm64
    needs: build
    runs-on: windows-11-arm
    timeout-minutes: 10
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the exact release candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: QuotaPin-Package-${{ github.sha }}
          path: dist/arm64-acceptance
      - name: Install, execute, and uninstall the x64 package under emulation
        shell: powershell
        run: |
          $package = @(Get-ChildItem -LiteralPath 'dist\arm64-acceptance' -Filter 'QuotaPin-*.exe' -File)
          if ($package.Count -ne 1) { throw "Expected one Windows package; found $($package.Count)." }
          .\scripts\test-windows-arm64-emulation.ps1 -PackagePath $package[0].FullName

  publish:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/') && github.event.repository.private == false
    needs: [build, windows-arm64-emulation]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out the same tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download verified cross-platform candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: QuotaPin-Package-${{ github.sha }}
          path: release

      - name: Reverify candidate and source provenance
        run: >-
          node scripts/public-release.mjs verify
          --root .
          --directory release
          --repository "$OFFICIAL_REPOSITORY"
          --commit "$GITHUB_SHA"
          --tag "$GITHUB_REF_NAME"
          --workflow-run-id "$GITHUB_RUN_ID"

      - name: Publish only the reviewed platform packages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = (Get-Content -Raw VERSION).Trim()
          $isStable = $version -cmatch '^\d+\.\d+\.\d+$'
          $isBeta = $version -cmatch '^\d+\.\d+\.\d+-beta\.\d+$'
          if (-not $isStable -and -not $isBeta) { throw 'Only reviewed stable or beta versions may be published.' }
          $prereleaseFlag = if ($isBeta) { 'true' } else { 'false' }
          $latestFlag = if ($isStable) { 'true' } else { 'false' }
          $notesPath = Join-Path '.github/release-notes' "$tag.md"
          if (-not (Test-Path -LiteralPath $notesPath -PathType Leaf)) { throw "Missing reviewed release notes: $notesPath" }

          $publicNames = @(node scripts/public-release.mjs list)
          if ($LASTEXITCODE -ne 0 -or -not $publicNames.Count) { throw 'Could not resolve the public release asset policy.' }
          $assets = @($publicNames | ForEach-Object {
            $path = Join-Path release $_
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing public release asset: $_" }
            (Resolve-Path -LiteralPath $path).Path
          })

          $publishedNotesPath = Join-Path $env:RUNNER_TEMP "QuotaPin-$version-release-notes.md"
          Copy-Item -LiteralPath $notesPath -Destination $publishedNotesPath -Force
          Add-Content -LiteralPath $publishedNotesPath -Encoding utf8 -Value "`n## SHA-256`n"
          foreach ($asset in $assets) {
            $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
            Add-Content -LiteralPath $publishedNotesPath -Encoding utf8 -Value "- ``$(Split-Path -Leaf $asset)``: ``$hash``"
          }
          $notesPath = $publishedNotesPath

          $existingJson = & gh release view $tag --json isDraft,assets 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existing = $existingJson | ConvertFrom-Json
            if (-not $existing.isDraft) { throw "Release $tag is already published; refusing to mutate it." }
            foreach ($asset in @($existing.assets)) {
              & gh release delete-asset $tag ([string]$asset.name) --yes
              if ($LASTEXITCODE -ne 0) { throw "Could not remove stale draft asset $($asset.name)." }
            }
          }
          else {
            & gh release create $tag --draft --verify-tag "--prerelease=$prereleaseFlag" "--latest=$latestFlag" --title "QuotaPin $version" --notes-file $notesPath
            if ($LASTEXITCODE -ne 0) { throw "Could not create draft release $tag." }
          }

          & gh release edit $tag --draft "--prerelease=$prereleaseFlag" "--latest=$latestFlag" --title "QuotaPin $version" --notes-file $notesPath
          if ($LASTEXITCODE -ne 0) { throw "Could not refresh draft release $tag." }
          & gh release upload $tag @assets
          if ($LASTEXITCODE -ne 0) { throw "Could not upload release assets for $tag." }

          $uploaded = & gh release view $tag --json isDraft,assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $uploaded.isDraft) { throw "Could not re-read draft release $tag." }
          $expectedJson = @($publicNames | Sort-Object) | ConvertTo-Json -Compress
          $actualJson = @($uploaded.assets | ForEach-Object { [string]$_.name } | Sort-Object) | ConvertTo-Json -Compress
          if ($actualJson -cne $expectedJson) {
            throw "Remote draft asset set differs from policy. Expected $expectedJson; found $actualJson."
          }

          & gh release edit $tag --draft=false "--prerelease=$prereleaseFlag" "--latest=$latestFlag"
          if ($LASTEXITCODE -ne 0) { throw "Could not publish release $tag." }
          $published = & gh release view $tag --json isDraft,isPrerelease,assets | ConvertFrom-Json
          $publishedJson = @($published.assets | ForEach-Object { [string]$_.name } | Sort-Object) | ConvertTo-Json -Compress
          if ($LASTEXITCODE -ne 0 -or $published.isDraft -or [bool]$published.isPrerelease -ne [bool]$isBeta -or $publishedJson -cne $expectedJson) {
            throw "Published release $tag did not preserve the exact reviewed asset set."
          }

          if ($isStable) {
            $latestTag = & gh api `
              -H 'Accept: application/vnd.github+json' `
              -H 'X-GitHub-Api-Version: 2026-03-10' `
              "repos/$env:GH_REPO/releases/latest" --jq '.tag_name' 2>$null
            if ($LASTEXITCODE -ne 0 -or $latestTag -cne $tag) {
              throw "Stable release $tag was not confirmed as Latest."
            }
          }

          $immutable = $false
          foreach ($attempt in 1..6) {
            $releaseImmutable = & gh api `
              -H 'Accept: application/vnd.github+json' `
              -H 'X-GitHub-Api-Version: 2026-03-10' `
              "repos/$env:GH_REPO/releases/tags/$tag" --jq '.immutable' 2>$null
            if ($LASTEXITCODE -eq 0 -and $releaseImmutable -ceq 'true') { $immutable = $true; break }
            Start-Sleep -Seconds 2
          }
          if (-not $immutable) { throw "Published release $tag was not confirmed immutable." }

name: Compatibility bug
description: Report a QuotaPin compatibility or launch problem
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        This report will be public. Remove account names, task content, thread titles, tokens, private paths, and unsanitized screenshots before submitting.
  - type: input
    id: quotapin
    attributes:
      label: QuotaPin version
    validations:
      required: true
  - type: input
    id: codex
    attributes:
      label: Codex Desktop version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system
      description: Include the Windows or macOS version and x64, Intel, or Apple silicon.
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Installation path
      options:
        - Windows one-line command
        - Downloaded Windows EXE / guided installer
        - macOS one-line command
        - Downloaded macOS DMG / Installer app
        - Local source checkout
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include the smallest repeatable sequence and the visible result.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Optional lifecycle log excerpt or screenshot. Do not attach task content, account data, tokens, or private paths.
  - type: checkboxes
    id: privacy
    attributes:
      label: Public report
      options:
        - label: I checked this report and its attachments for private Codex content.
          required: true

name: check

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

jobs:
  macos-developer-preview:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - name: Verify platform-neutral quota, renderer, and Mac adapter core
        run: |
          npm ci
          node --test test/experiments.test.mjs test/format.test.mjs test/renderer-state.test.mjs test/showcase-renderer.test.mjs test/macos-adapter.test.mjs
      - name: Check macOS developer lifecycle scripts
        run: |
          bash -n scripts/macos/build-dev.sh
          bash -n scripts/macos/install-dev.sh
          bash -n scripts/macos/uninstall-dev.sh
      - name: Build and self-check macOS developer preview
        run: ./scripts/macos/build-dev.sh
      - name: Upload commit-scoped macOS development artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: QuotaPin-macOS-dev-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          path: dist/macos-dev/

  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1
          package-manager-cache: false
      - name: Check JavaScript syntax
        timeout-minutes: 8
        run: |
          npm ci
          npm run check
      - name: Check Windows PowerShell syntax
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count) {
              $failed = $true
              $errors | ForEach-Object { Write-Error "$($_.Extent.File): $($_.Message)" }
            }
          }
          if ($failed) { exit 1 }
      - name: Install the pinned Inno Setup compiler
        shell: powershell
        run: .\scripts\install-inno-ci.ps1
      - name: Build and self-check the complete Windows package
        shell: powershell
        run: .\scripts\build-windows.ps1
      - name: Verify the single-package public candidate
        shell: powershell
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          $commit = (& git rev-parse HEAD).Trim()
          $candidateTag = "v$version"
          & git tag $candidateTag $commit
          if ($LASTEXITCODE -ne 0) { throw 'Could not create the local candidate tag.' }
          try {
            node scripts/public-release.mjs prepare-ci --root . --source dist --output dist/public --repository https://github.com/WSL043/QuotaPin-for-Codex --commit $commit --tag $candidateTag --workflow-run-id $env:GITHUB_RUN_ID
            if ($LASTEXITCODE -ne 0) { throw 'CI candidate preparation failed.' }
            node scripts/public-release.mjs verify-ci --root . --directory dist/public --repository https://github.com/WSL043/QuotaPin-for-Codex --commit $commit --tag $candidateTag --workflow-run-id $env:GITHUB_RUN_ID
            if ($LASTEXITCODE -ne 0) { throw 'CI candidate verification failed.' }
          }
          finally {
            & git tag --delete $candidateTag | Out-Null
          }
